name: Phuket Tour Watcher

on:
  schedule:
    # Запуск каждые 4 часа
    - cron: '0 9 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой Run workflow

jobs:
  check-tours:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tour watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tour_watcher.py

      - name: Save seen tours state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_tours.json || true
          git diff --staged --quiet || (git commit -m "chore: update seen tours history [skip ci]" && git push)